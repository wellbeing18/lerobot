hardware_id: xlerobot_bimanual_v1
last_scan: '2026-01-25T00:00:00.000000'
robot:
  type: bi_so101_follower
  id: xlerobot_bimanual
  left_arm:
    port: /dev/ttyACM1
    id: xlerobot_left_arm
    use_degrees: true
    disable_torque_on_disconnect: true
    usb_serial: null
    usb_path: null
  right_arm:
    port: /dev/ttyACM0
    id: xlerobot_right_arm
    use_degrees: true
    disable_torque_on_disconnect: true
    usb_serial: null
    usb_path: null
teleop:
  type: bi_so101_leader
  id: xlerobot_bimanual_leader
  left_arm:
    port: /dev/ttyACM3
    id: xlerobot_left_leader
    use_degrees: true
    usb_serial: null
    usb_path: null
  right_arm:
    port: /dev/ttyACM2
    id: xlerobot_right_leader
    use_degrees: true
    usb_serial: null
    usb_path: null
cameras:
  head:
    type: opencv
    index_or_path: 4
    width: 640
    height: 480
    fps: 30
    fourcc: MJPG
    capture_width: 800
    capture_height: 600
    crop_y_offset: 60
    usb_serial: null
    usb_path: null
  left_wrist:
    type: opencv
    index_or_path: 6
    width: 640
    height: 480
    fps: 30
    fourcc: MJPG
    usb_serial: null
    usb_path: null
  right_wrist:
    type: opencv
    index_or_path: 8
    width: 640
    height: 480
    fps: 30
    fourcc: MJPG
    usb_serial: null
    usb_path: null
calibration:
  base_dir: ~/.cache/huggingface/lerobot/calibration/robots/so101_follower
  files:
    xlerobot_left_arm: xlerobot_left_arm.json
    xlerobot_right_arm: xlerobot_right_arm.json
    xlerobot_left_leader: xlerobot_left_leader.json
    xlerobot_right_leader: xlerobot_right_leader.json
action:
  dim: 12
  fps: 30
  joint_names:
  - left_shoulder_pan.pos
  - left_shoulder_lift.pos
  - left_elbow_flex.pos
  - left_wrist_flex.pos
  - left_wrist_roll.pos
  - left_gripper.pos
  - right_shoulder_pan.pos
  - right_shoulder_lift.pos
  - right_elbow_flex.pos
  - right_wrist_flex.pos
  - right_wrist_roll.pos
  - right_gripper.pos
inference:
  action_interval: 0.033
  default_duration: 60
  device: cuda
